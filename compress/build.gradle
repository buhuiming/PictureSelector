plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'maven-publish'
}

android {
    compileSdk 35

    defaultConfig {
        minSdk 14
        targetSdk 35
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        buildConfig true
    }
    namespace "top.zibin.luban"
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

ext {
    PUBLISH_ARTIFACT_ID = "compress"
}

ext.GROUP = "com.github.buhuiming"
ext.POM_ARTIFACT_ID = "compress"
ext.VERSION_NAME = "3.12.0"
//引用gradle_upload.gradle
apply from: "${project.rootDir}/publish.gradle"

afterEvaluate {
    publishing {
        publications {
            // 这个mavenJava可以随便填，只是一个任务名字而已
            // MavenPublication必须有，这个是调用的任务类
            mavenJava(MavenPublication) {
                // 这里头是artifacts的配置信息，不填会采用默认的
                groupId = 'com.github.buhuiming'
                artifactId = 'compress'
                version = '3.12.0'

                from components.release
                artifact tasks.named('compress').get() //打包源码，去除这行打的包将看不到源码
            }
        }
    }
}
// 用于打包源代码的任务
tasks.register('compress', Jar) {
    archiveClassifier.set('sources')
    from android.sourceSets.main.java.srcDirs
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
}