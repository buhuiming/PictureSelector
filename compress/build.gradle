plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'maven-publish'
}

android {
    compileSdk 35

    defaultConfig {
        minSdk 14
        targetSdk 35
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        buildConfig true
    }
    namespace "top.zibin.luban"
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

ext {
    PUBLISH_ARTIFACT_ID = "compress"
}

ext.GROUP = "com.github.buhuiming"
ext.POM_ARTIFACT_ID = "compress"
ext.VERSION_NAME = "3.15.1"
//引用gradle_upload.gradle
apply from: "${project.rootDir}/publish.gradle"

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
}