plugins {
    id 'com.android.library'
}

android {
    compileSdk 30

    lintOptions {
        abortOnError false
    }
    defaultConfig {
        minSdk 9
        targetSdk 30
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        buildConfig true
    }
    namespace "tv.danmaku.ijk.media.player"
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}

